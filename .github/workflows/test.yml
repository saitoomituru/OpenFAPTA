name: Pythonトイモデル検査

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: トイモデルを検査
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v
      - name: CLIを起動
        env:
          PYTHONPATH: src
        run: python3 -m openfapta.cli --model all
