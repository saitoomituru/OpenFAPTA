[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openfapta"
version = "0.1.0"
description = "FAPTA philosophy and mathematical toy experiments"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "齋藤みつる / saitoomituru"}]
dependencies = []

[project.scripts]
openfapta = "openfapta.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

